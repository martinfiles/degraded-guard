name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: mkdir -p tools && curl -sL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: TLC
        working-directory: spec
        run: |
          java -cp ../tools/tla2tools.jar tlc2.TLC -config Protocol.cfg -deadlock DegradedMode.tla
          java -cp ../tools/tla2tools.jar tlc2.TLC -config Guarded.cfg -deadlock DegradedMode.tla
          ! java -cp ../tools/tla2tools.jar tlc2.TLC -config Deviation.cfg -deadlock DegradedMode.tla
      - run: cd engine && npm ci && npm test && npm run typecheck
      - run: cd web && npm ci && npm run build
